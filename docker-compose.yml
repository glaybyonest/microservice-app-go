version: "3.8"
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build: .
    environment:
      SERVER_ID: backend-1
      DATABASE_URL: postgres://user:password@postgres:5432/usersdb?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      JWT_SECRET: supersecret
    networks:
      - app-network
    depends_on:
      - postgres
      - mongo
      - redis

  backend2:
    build: .
    environment:
      SERVER_ID: backend-2
      DATABASE_URL: postgres://user:password@postgres:5432/usersdb?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      JWT_SECRET: supersecret
    networks:
      - app-network
    depends_on:
      - postgres
      - mongo
      - redis

  backend3:
    build: .
    environment:
      SERVER_ID: backend-3-backup
      DATABASE_URL: postgres://user:password@postgres:5432/usersdb?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      JWT_SECRET: supersecret
    networks:
      - app-network
    depends_on:
      - postgres
      - mongo
      - redis

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usersdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    networks:
      - app-network

volumes:
  postgres_data:
  mongo_data:

networks:
  app-network:
    driver: bridge